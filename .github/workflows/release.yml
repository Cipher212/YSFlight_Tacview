# Publishes a GitHub Release of the Windows package: a permanent download (Actions artifacts are
# deleted after 30 days). It runs when the VERSION file changes on main or a claude/ branch, or
# by hand (Actions > Release > Run workflow, once this file is on main). The release is named
# after VERSION (v1.0, v1.1 ...) with the notes in docs/release_notes/<version>.md; running it
# again for the same version replaces the zip.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION)"
          if ! [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "VERSION must look like v1.0, not '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Godot 4.7.2 and its Windows export template
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d ~/.local/share/godot/export_templates/4.7.2.stable
          rm templates.tpz

      - name: Import the project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Build the package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: >
          python3 tools/package.py --godot ./Godot_v4.7.2-stable_linux.x86_64 --version "$VERSION"
          --python-zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ZIP="build/YSFlight-Replay-Viewer-$VERSION-win64.zip"
          NOTES="docs/release_notes/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            echo "YSFlight Replay Viewer $VERSION. Download the zip below, unzip it and double-click the .exe." > "$NOTES"
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" "$ZIP" --clobber
          else
            gh release create "$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "YSFlight Replay Viewer $VERSION" --notes-file "$NOTES"
          fi
